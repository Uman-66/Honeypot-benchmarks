services:
  cowrie:
    image: cowrie/cowrie@sha256:baf351038db967704dfa39f7ce860e8875c9456cdab72a9d3257c4247211050d
    ports:
      - "127.0.0.1:2223:2222"
    environment:
      COWRIE_SSH_VERSION: "SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.3"
      COWRIE_HONEYPOT_HOSTNAME: "ubuntu"
      COWRIE_TELNET_ENABLED: "false"
      COWRIE_OUTPUT_JSONLOG_ENABLED: "true"
      COWRIE_OUTPUT_CRASHREPORTER_ENABLED: "false"
    volumes:
      - cowrie_var:/cowrie/cowrie-git/var
    dns:
      - 127.0.0.1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  cowrie_var: