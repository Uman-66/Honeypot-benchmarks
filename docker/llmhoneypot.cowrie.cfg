# docker/llmhoneypot.cowrie.cfg
#
# Cowrie 2.6.1 configuration for the llm-honeypot container.
# This file is read by Cowrie as etc/cowrie.cfg (relative to WORKDIR
# /home/cowrie/cowrie).  Sections and keys not listed here fall back
# to defaults from etc/cowrie.cfg.dist.
#
# Changes from llm-honeypot/configs/cowrie.cfg:
#   - hostname: "sys" → "ubuntu"
#   - [ssh] version: updated to SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.3
#     The full "SSH-2.0-" prefix IS required: cowrie/ssh/factory.py reads
#     the string verbatim and transport.py writes it directly to the wire.
#   - contents_path = honeyfs  (confirmed path in cowrie-base: the honeyfs/
#     tree lives at the repo root, not inside src/. The default value
#     "honeyfs" is correct and resolves relative to WORKDIR.)
#   - data_path = src/cowrie/data  (confirmed from CHANGELOG 2.6.0: static
#     files moved from share/cowrie to src/cowrie/data; cfg.dist confirms.)
#   - All network output plugins explicitly disabled (they were already off
#     in the upstream configs; kept explicit for auditability).
#   - output_crashreporter enabled = false  (sends tracebacks to api.cowrie.org)
#   - [telnet] enabled = false
#   - [ssh] forwarding = false  (no TCP forwarding)

[honeypot]

hostname = ubuntu

log_path = var/log/cowrie
download_path = ${honeypot:state_path}/downloads

# data_path: static data files (fs.pickle, cmdoutput.json, arch/, txtcmds/).
# CHANGELOG 2.6.0: moved from share/cowrie to src/cowrie/data.
# Confirmed by cowrie-base/etc/cowrie.cfg.dist and directory listing.
data_path = src/cowrie/data

state_path = var/lib/cowrie
etc_path = etc

# contents_path: virtual file contents (honeyfs/).
# cowrie-base keeps honeyfs/ at the repo root (= WORKDIR /home/cowrie/cowrie).
# The overlay copies motd, version, passwd into honeyfs/ at build time.
contents_path = honeyfs

txtcmds_path = src/cowrie/data/txtcmds

ttylog = true
ttylog_path = ${honeypot:state_path}/tty
interactive_timeout = 180
authentication_timeout = 120
backend = shell
logtype = rotating
timezone = UTC

auth_class = UserDB

[shell]

filesystem = ${honeypot:data_path}/fs.pickle
processes = ${honeypot:data_path}/cmdoutput.json
arch = linux-x64-lsb

kernel_version = 3.2.0-4-amd64
kernel_build_string = #1 SMP Debian 3.2.68-1+deb7u1
hardware_platform = x86_64
operating_system = GNU/Linux

ssh_version = OpenSSH_5.3p1, OpenSSL 0.9.8k 25 Mar 2009

[ssh]

enabled = true

rsa_public_key = ${honeypot:state_path}/ssh_host_rsa_key.pub
rsa_private_key = ${honeypot:state_path}/ssh_host_rsa_key
dsa_public_key = ${honeypot:state_path}/ssh_host_dsa_key.pub
dsa_private_key = ${honeypot:state_path}/ssh_host_dsa_key
ecdsa_public_key = ${honeypot:state_path}/ssh_host_ecdsa_key.pub
ecdsa_private_key = ${honeypot:state_path}/ssh_host_ecdsa_key
ed25519_public_key = ${honeypot:state_path}/ssh_host_ed25519_key.pub
ed25519_private_key = ${honeypot:state_path}/ssh_host_ed25519_key

public_key_auth = ssh-rsa,ecdsa-sha2-nistp256,ssh-ed25519

# Full SSH-2.0- prefix IS required.
# cowrie/ssh/factory.py line 108-110:
#   self.ourVersionString = CowrieConfig.get("ssh", "version", ...).encode("ascii")
# cowrie/ssh/transport.py line 81:
#   self.transport.write(self.ourVersionString + b"\r\n")
# The value is written verbatim to the wire; no prefix is prepended.
# On-wire banner will be exactly: SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.3
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.3

listen_endpoints = tcp:2222:interface=0.0.0.0

sftp_enabled = true
forwarding = false
forward_redirect = false
forward_tunnel = false
auth_publickey_allow_any = false
auth_keyboard_interactive_enabled = false

[telnet]

# Telnet MUST be disabled.
enabled = false

# ============================================================================
# Output Plugins — only local JSON log enabled; all network plugins disabled
# ============================================================================

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false

[output_xmpp]
enabled = false

[output_elasticsearch]
enabled = false

[output_dshield]
enabled = false

[output_graylog]
enabled = false

[output_localsyslog]
enabled = false

[output_mysql]
enabled = false

[output_rethinkdblog]
enabled = false

[output_sqlite]
enabled = false

[output_mongodb]
enabled = false

[output_splunk]
enabled = false

[output_hpfeeds3]
enabled = false

[output_virustotal]
enabled = false

[output_cuckoo]
enabled = false

[output_malshare]
enabled = false

[output_slack]
enabled = false

[output_csirtg]
enabled = false

[output_socketlog]
enabled = false

[output_s3]
enabled = false

[output_influx]
