## DECEIVE LLM SSH Honeypot – Docker Compose
##
## Usage (from repo root):
##   docker compose -f docker/deceive.compose.yaml up --build
##
## Secrets are loaded from ../.env (relative to this file = docker/), which must contain:
##   OPENAI_API_KEY=<your Fireworks API key>
##   OPENAI_BASE_URL=https://api.fireworks.ai/inference/v1
##
## The SSH listener is bound to 127.0.0.1:8022 only.
## Authentication: the 'guest' account has a blank password in config.ini
## [user_accounts], so asyncssh's begin_auth() returns False immediately —
## the server accepts "none" auth without prompting for a password.

name: deceive

services:
  deceive:
    build:
      # Build context is the repo root so DECEIVE/ and docker/ are both reachable.
      # The slim Dockerfile copies docker/deceive.requirements.txt and DECEIVE/.
      context: ..
      dockerfile: docker/deceive.slim.Dockerfile

    restart: "no"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    # Bind to loopback only — no external exposure.
    # Host port 8022 matches DECEIVE/SSH/config.ini [ssh] port = 8022.
    ports:
      - "127.0.0.1:8022:8022"

    # Fireworks API key and base URL — loaded from ../.env (relative to docker/).
    # NEVER bake secrets into the image; only pass them at runtime via env_file.
    env_file:
      - ../.env
