# cowrie.cfg — Cowrie SSH honeypot override configuration
# This file is mounted read-only over /cowrie/cowrie/etc/cowrie.cfg inside the container.
# Only sections and keys that differ from upstream defaults are listed here.
# Cowrie merges this file on top of its built-in cowrie.cfg.dist at startup.
#
# UNVERIFIED: exact internal path — confirmed as /cowrie/cowrie/etc/cowrie.cfg in
#   cowrie/cowrie:latest (as of 2024).  If startup fails with "no config found",
#   try the alternate path /cowrie/etc/cowrie.cfg.

[honeypot]

# Fake hostname shown in the shell prompt (e.g. root@ubuntu:~#).
# Option name VERIFIED: upstream cowrie.cfg.dist uses 'hostname'.
hostname = ubuntu

# Fake operating system name used in /etc/issue and uname output.
# UNVERIFIED: whether this key exists in the version you pull.
# Leave commented out to accept the upstream default (linux).
# fake_os_name = Linux

# Userdb file location inside the container.
# UNVERIFIED: default path; override only if the image does not find it automatically.
# auth_class_parameters = /cowrie/cowrie/etc/userdb.txt


[ssh]

# SSH server version string.
# Cowrie prepends "SSH-2.0-" to this value automatically
# (source: cowrie/ssh/factory.py sets factory.version = b"SSH-2.0-" + version.encode()).
# DO NOT include "SSH-2.0-" here — it would produce a doubled prefix on the wire.
# UNVERIFIED: exact code path in the tag you pull; confirm with:
#   docker exec <container> grep -r 'SSH-2.0' /cowrie/cowrie/
version = OpenSSH_8.2p1 Ubuntu-4ubuntu0.3

# Keep SSH enabled (default); set to false to disable.
enabled = true


[telnet]

# Telnet is DISABLED — only SSH is needed for this benchmark.
# UNVERIFIED: key name.  Upstream default is 'enabled = false'; setting explicitly.
enabled = false


[shell]

# Prevent Cowrie from making real outbound HTTP/S requests when an attacker
# runs wget or curl inside the honeypot.
# With download_enabled = false Cowrie logs the attempted URL but returns a
# simulated failure instead of actually fetching from the internet.
# This is the safest option that still records the download attempt.
# UNVERIFIED: key name in the version you pull.  Upstream key is 'download_enabled'
# in cowrie/commands/wget.py and cowrie/commands/curl.py.
# If the setting has no effect, block outbound traffic at the Docker network level
# by removing any external DNS/gateway from the container network (see compose file).
download_enabled = false


[output_jsonlog]

# Enable JSON log output — one JSON object per line, written to
# /cowrie/var/log/cowrie/cowrie.json inside the container.
# This is the primary log format used by the benchmark analysis scripts.
# UNVERIFIED: exact section name.  Upstream uses [output_jsonlog].
enabled = true

# Log file path inside the container.
# UNVERIFIED: default is cowrie.json; override only if needed.
# logfile = cowrie.json


[output_textlog]

# Plain-text log alongside JSON; useful for quick inspection.
# UNVERIFIED: section name.  Keep enabled (default) for debugging.
enabled = true


[output_mysql]
enabled = false

[output_sqlite]
enabled = false

[output_elasticsearch]
enabled = false

[output_splunk]
enabled = false

[output_hpfeeds]
enabled = false

[output_telegram]
enabled = false

[output_slack]
enabled = false

[output_csirtg]
enabled = false

[output_virustotal]
enabled = false
