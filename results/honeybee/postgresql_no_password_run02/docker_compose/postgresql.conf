# -----------------------------------------------------------------
# postgresql.conf - INSECURE demonstration settings
# -----------------------------------------------------------------

# MISCONFIGURATION: listen_addresses = '*' makes PostgreSQL listen on
# every network interface inside the container. Combined with the
# published port "5432:5432" in docker-compose.yaml, the database
# accepts connections from ANY IP address that can reach the host.
listen_addresses = '*'

port = 5432
max_connections = 100

# MISCONFIGURATION: Connection logging disabled - failed login attempts
# (e.g., brute-force attacks) go completely unnoticed.
log_connections = off
log_disconnections = off

# MISCONFIGURATION: No timeout for idle transactions - sessions can hold
# locks indefinitely (resource exhaustion / lock starvation risk).
idle_in_transaction_session_timeout = 0

shared_buffers = 128MB