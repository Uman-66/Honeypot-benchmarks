# -----------------------------------------------------------------
# INSECURE PostgreSQL configuration - FOR DEMONSTRATION ONLY
# -----------------------------------------------------------------

# MISCONFIGURATION: Listen on ALL network interfaces.
# The database becomes reachable from any network that can route to the
# container host, instead of only localhost or a private interface.
listen_addresses = '*'

port = 5432
max_connections = 100

# MISCONFIGURATION: Connection logging disabled - hides brute-force
# and unauthorized-access attempts from administrators.
log_connections = off
log_disconnections = off

# MISCONFIGURATION: SSL disabled - credentials and data travel in plaintext.
ssl = off