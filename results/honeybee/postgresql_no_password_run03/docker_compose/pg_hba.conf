# ------------------------------------------------------------------
# pg_hba.conf - INSECURE CLIENT AUTHENTICATION (DEMONSTRATION ONLY)
# ------------------------------------------------------------------
# TYPE      DATABASE    USER        ADDRESS         METHOD

# MISCONFIGURATION: 'trust' method allows ANY local user to connect
# as ANY PostgreSQL role WITHOUT supplying a password
local       all         all                         trust

# MISCONFIGURATION: 'trust' for every IPv4 address (0.0.0.0/0) means
# any host on any network can log in as any user (including 'postgres'
# superuser) with NO password whatsoever
host        all         all         0.0.0.0/0       trust

# MISCONFIGURATION: Same unrestricted trust access for IPv6 clients
host        all         all         ::0/0           trust

# NOTE: No 'md5', 'scram-sha-256', or 'reject' entries exist.
# Authentication is effectively disabled for the entire server.