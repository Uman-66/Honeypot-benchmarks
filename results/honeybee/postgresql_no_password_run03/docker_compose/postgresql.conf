# ------------------------------------------------------------------
# PostgreSQL configuration - INSECURE SETTINGS FOR DEMONSTRATION ONLY
# ------------------------------------------------------------------

# MISCONFIGURATION: listen_addresses = '*' makes PostgreSQL accept
# connections on ALL network interfaces of the container, not just localhost.
# Combined with the exposed port 5432, the database is reachable from anywhere.
listen_addresses = '*'

port = 5432
max_connections = 100

# Logging is minimal, making it harder to detect brute-force or abuse
log_connections = off
log_disconnections = off