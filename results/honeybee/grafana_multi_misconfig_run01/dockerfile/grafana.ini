; ============================================================
; Grafana configuration with INTENTIONAL security misconfigurations
; For educational/lab use only - DO NOT use in production.
; ============================================================

[server]
; MISCONFIGURATION: Admin interface exposed to the internet
; Binding to 0.0.0.0 makes the Grafana UI (including the admin
; login) reachable from every network interface.
; Impact: Internet-facing admin panel, an easy target for attacks.
http_addr = 0.0.0.0
http_port = 3000
; Allows the UI to be embedded in any site (clickjacking risk)
allow_embedding = true

[security]
; MISCONFIGURATION: Default admin credentials left unchanged
; The well-known admin/admin pair is kept as-is.
; Impact: Trivial admin takeover with public default credentials.
admin_user = admin
admin_password = admin
; MISCONFIGURATION: Brute-force protection disabled
; Impact: Unlimited password guessing / credential stuffing.
disable_brute_force_login = true

[users]
; MISCONFIGURATION: Open self-registration with Admin role
; Anyone can create an account and is automatically granted full
; administrative permissions (no RBAC).
; Impact: Privilege escalation for every visitor.
allow_sign_up = true
auto_assign_org_role = Admin

[auth.anonymous]
; MISCONFIGURATION: Anonymous access granted the Admin role
; No login required at all - every visitor acts as Admin.
; Impact: Complete absence of authentication and RBAC.
enabled = true
org_name = Main Org.
org_role = Admin
hide_version = false
