version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"  # MISCONFIGURATION: Binds to 0.0.0.0, exposing the admin UI directly to the internet
    environment:
      # MISCONFIGURATION: Default admin credentials left unchanged (admin/admin)
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # MISCONFIGURATION: Anonymous authentication enabled and granted the Admin role (no RBAC)
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      # MISCONFIGURATION: Open self-registration; new users are automatically assigned Admin
      - GF_USERS_ALLOW_SIGN_UP=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"  # MISCONFIGURATION: Metrics backend exposed without authentication
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-admin-api'  # MISCONFIGURATION: Admin API enabled without authentication
    restart: always

volumes:
  grafana_data: