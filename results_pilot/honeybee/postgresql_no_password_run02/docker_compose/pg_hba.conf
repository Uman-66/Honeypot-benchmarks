# -----------------------------------------------------------------
# pg_hba.conf - INSECURE client authentication rules
#
# The 'trust' method allows ANY client to connect as ANY user
# WITHOUT supplying a password.
# -----------------------------------------------------------------

# TYPE      DATABASE    USER        ADDRESS         METHOD

# MISCONFIGURATION: Passwordless access for all users via the unix socket
local       all         all                         trust

# MISCONFIGURATION: Passwordless access from ANY IPv4 address
host        all         all         0.0.0.0/0       trust

# MISCONFIGURATION: Passwordless access from ANY IPv6 address
host        all         all         ::/0            trust